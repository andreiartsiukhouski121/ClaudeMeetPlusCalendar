# The same set of checks as the local `pnpm verify`, but on GitHub's side.
#
# The steps are split one per check rather than a single `pnpm verify` call, and that does not
# contradict the "do one pnpm verify" rule from the regression-verify skill. That rule saves
# **dev server starts**, and only the `pnpm e2e` step makes those; lint, typecheck, units and audit
# start no servers, so splitting them is free. In exchange, the GitHub UI shows which stage failed
# — there is no asking interactively there.
#
# No secrets are needed: playwright.config.ts passes JWT_SECRET and API_URL through webServer.env.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: queued stale checks are pointless. main
# is exempt — every commit there must be checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Git hooks are useless on CI, and the prepare script installs them on every install.
  HUSKY: 0

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # fetch-depth: 0 rather than the default shallow clone: case LG-API-04 resolves ledger commit
      # hashes through git cat-file, and in a shallow copy it finds none — the run fails with
      # "commits do not exist in the repository" while the ledger is fine. Caught by the very first
      # CI run (FX-018). The history is small, so a full fetch costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm is installed before setup-node: otherwise the 'pnpm' cache in setup-node finds no
      # package manager. No version is pinned — it comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser is cached separately from node_modules: it weighs hundreds of megabytes and
      # does not change until the @playwright/test version does. The key comes from the lock file.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        # --with-deps is always needed, even on a cache hit: the system libraries live outside
        # ~/.cache and are absent on a fresh runner.
        run: pnpm exec playwright install --with-deps chromium

      # From here on, the local pipeline step by step, in the same order: cheapest first.
      # Orientation comes first: it takes a second and proves the task was planned at all.
      - name: Plan orientation
        run: pnpm check:orientation

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Nest supertest suite
        run: pnpm --filter @purpleschool/api test:e2e

      - name: Formatting
        run: pnpm format:check

      # The only step that starts dev servers. One call for the whole suite, both projects.
      - name: E2E, whole suite
        run: pnpm e2e

      # The report matters exactly on failure: locally it is opened with pnpm e2e:report, on CI it
      # is downloaded as an artifact. Without it a CI failure cannot be reconstructed.
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Last: this step depends on the state of other people's dependencies and can go red on a
      # change we did not make. By now every other result is already visible.
      - name: Dependency vulnerabilities
        run: pnpm audit --audit-level high

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate job rather than a step in verify: a production build checks something else —
      # that the code compiles outside dev mode. Errors only `next build` sees (invalid metadata,
      # static generation problems) never surface in a dev run.
      - name: Build
        run: pnpm build

      # There is no deployment: no platform has been chosen and no secrets exist for one. An
      # artifact is delivery without deployment, and it is named honestly. A real deploy gets added
      # when the customer says where and with what; inventing one with non-existent tokens would
      # look like it works and would not.
      - name: Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/web/.next/
            apps/api/dist/
          retention-days: 7
