packages:
  - 'apps/*'
  - 'packages/*'

# Единые версии общих инструментов для всех пакетов монорепозитория.
catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^24.13.3
  eslint: ^9.39.5
  eslint-config-next: ^16.3.4
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  prettier: ^3.9.6
  typescript: ^6.0.3
  typescript-eslint: ^8.69.0

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Транзитив @nestjs/platform-express@12.0.1 тянет multer@2.2.0, а в нём два high:
# GHSA-qfvm-cv95-jqjf и GHSA-535w-7cp7-47q4 (DoS). Nest диапазон пока не поднял, поэтому
# поднимаем здесь: без override `pnpm audit --audit-level high` красный, а это блокер приёмки
# по `regression-verify` §3. Снять, когда Nest перейдёт на multer >=2.3.0 сам.
overrides:
  multer: '>=2.3.0'
