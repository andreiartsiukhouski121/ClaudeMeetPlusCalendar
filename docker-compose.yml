services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: purpleschool
      POSTGRES_PASSWORD: purpleschool
      # The default database created by the image — development's `purpleschool`. The suite's
      # `purpleschool_e2e` is created by the mounted init script below, which the image runs only
      # once, against a fresh volume.
      POSTGRES_DB: purpleschool
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18's image organizes data in a major-version subdirectory (pg_ctlcluster-style)
      # and errors out if the volume is mounted at the old .../data path instead of the parent —
      # confirmed by running this stack.
      - purpleschool-db-data:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U purpleschool -d purpleschool']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purpleschool-db-data:
